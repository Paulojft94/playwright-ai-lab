name: Playwright PR Comment
run-name: Playwright for PR #${{ github.event.issue.number }} by @${{ github.actor }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

# Serialize requests for the same PR so an older run cannot overwrite a newer result.
concurrency:
  group: playwright-pr-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/test' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Resolve pull request commit
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (pr.state !== 'open') {
              core.setFailed('The pull request must be open.');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              state: 'pending',
              context: 'Playwright / Chromium',
              description: 'Testes Chromium a correr.',
              target_url: runUrl,
            });
            core.setOutput('sha', pr.head.sha);
            await core.summary
              .addHeading(`Playwright: PR #${pr.number}`)
              .addRaw(`Testing commit: ${pr.head.sha}`)
              .write();

  test:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout pull request code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          # Avoid the browser extraction hang in older Playwright with newer Node.
          node-version: '24.15.0'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-pr-${{ github.event.issue.number }}
          path: playwright-report/
          retention-days: 30

  report:
    needs: [prepare, test]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.sha != '' }}
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: Publish commit status and PR comment
        uses: actions/github-script@v8
        env:
          PR_SHA: ${{ needs.prepare.outputs.sha }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const sha = process.env.PR_SHA;
            const result = process.env.TEST_RESULT;
            const passed = result === 'success';
            const message = passed
              ? '✅ Playwright / Chromium: passou.'
              : result === 'cancelled'
                ? '⚪ Playwright / Chromium: execução cancelada.'
                : '❌ Playwright / Chromium: falhou.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Attempt both updates even if one of the API calls fails.
            const updates = await Promise.allSettled([
              github.rest.repos.createCommitStatus({
                ...context.repo,
                sha,
                state: passed ? 'success' : 'failure',
                context: 'Playwright / Chromium',
                description: message,
                target_url: runUrl,
              }),
              github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `${message}\n\nCommit: \`${sha}\` · [Ver execução e relatório](${runUrl})`,
              }),
            ]);
            const operations = ['Atualizar estado do commit', 'Publicar comentário no PR'];
            for (const [index, update] of updates.entries()) {
              if (update.status === 'fulfilled') {
                core.info(`${operations[index]}: concluído.`);
                continue;
              }
              const error = update.reason;
              const required = error.response?.headers?.['x-accepted-github-permissions'];
              core.setFailed(`${operations[index]}: ${error.message} (HTTP ${error.status ?? 'desconhecido'}).`);
              if (required) core.info(`Permissões exigidas pelo GitHub: ${required}`);
            }
