name: Playwright PR Comment
run-name: Playwright for PR #${{ github.event.issue.number }} by @${{ github.actor }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/test' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Resolve pull request commit
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (pr.state !== 'open') {
              core.setFailed('The pull request must be open.');
              return;
            }
            core.setOutput('sha', pr.head.sha);
            await core.summary
              .addHeading(`Playwright: PR #${pr.number}`)
              .addRaw(`Testing commit: ${pr.head.sha}`)
              .write();

      - name: Checkout pull request code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          # Avoid the browser extraction hang in older Playwright with newer Node.
          node-version: '24.15.0'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-pr-${{ github.event.issue.number }}
          path: playwright-report/
          retention-days: 30
