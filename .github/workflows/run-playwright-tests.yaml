name: Run Playwright Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Playwright 1.56.1 supports this pinned runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: true
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v6
        with:
          # Match the existing workflows' browser-extraction-compatible version.
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and system dependencies
        timeout-minutes: 10
        # System dependencies are required even when the browser cache is restored.
        # Playwright reuses the cached browser if its revision is already installed.
        run: npx playwright install --with-deps chromium

      - name: Run all Playwright tests
        run: npm test

      - name: Upload HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
